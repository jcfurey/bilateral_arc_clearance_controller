name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  ros:
    name: ROS 2 ${{ matrix.name }} / Nav2
    runs-on: ubuntu-24.04
    container: ros:${{ matrix.distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nav2 1.3, Ubuntu 24.04, GCC 13, Python 3.12
          - distro: jazzy
            name: Jazzy
          # Nav2 1.5, Ubuntu 26.04, GCC 15, CMake 4, Python 3.14
          - distro: lyrical
            name: Lyrical
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build tools and dependencies
        shell: bash
        run: |
          apt-get update
          # The ros:<distro>-ros-base image is rebuilt less often than
          # packages.ros.org is synced, so the packages baked into it can be
          # older than the ones rosdep installs next. Across a sync that
          # changes generated typesupport code they no longer link together
          # (seen on Lyrical: a freshly installed geographic_msgs referenced a
          # symbol the image's std_msgs did not export, and every ROS test
          # binary failed to load). Bring the image up to the same sync first.
          apt-get dist-upgrade -y --no-install-recommends
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths . --ignore-src -r -y --rosdistro ${{ matrix.distro }}
      - name: Build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --base-paths . --packages-select bilateral_arc_clearance_controller \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon test --packages-select bilateral_arc_clearance_controller \
            --event-handlers console_direct+
          colcon test-result --verbose
